<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Signal tower with siren</title>
  <desc id="desc">A simple navy signal tower with radiating waves and a red siren beacon.</desc>
  <rect width="512" height="512" rx="112" fill="#F3F7FA"/>
  <!-- Radio waves -->
  <g fill="none" stroke="#2386A8" stroke-width="19" stroke-linecap="round">
    <path d="M156 162a144 144 0 0 0 0 204"/>
    <path d="M111 119a205 205 0 0 0 0 290"/>
    <path d="M356 162a144 144 0 0 1 0 204"/>
    <path d="M401 119a205 205 0 0 1 0 290"/>
  </g>
  <!-- Tower mast -->
  <g fill="none" stroke="#18354A" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 205 190 411M256 205l66 206M213 340h86M226 298h60M240 255h32"/>
    <path d="M179 411h154"/>
  </g>
  <!-- Beacon -->
  <path d="M224 147c0-18 14-32 32-32s32 14 32 32v17h-64z" fill="#F04452" stroke="#18354A" stroke-width="14" stroke-linejoin="round"/>
  <path d="M216 170h80" stroke="#18354A" stroke-width="16" stroke-linecap="round"/>
  <path d="M256 91V73M200 106l-13-13M312 106l13-13" stroke="#F2A73B" stroke-width="12" stroke-linecap="round"/>
</svg>
